<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CPA Spark（星火）：为 CLIProxyAPI 提供单账号与自定义分组的独立预热调度、计划预览和执行追踪。">
<meta name="theme-color" content="#f6f7f9"><title>CPA Spark · 账号预热工作台</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="shell">
<header class="plugin-header">
 <div class="plugin-heading">
  <div class="plugin-identity"><span class="plugin-mark" id="brandMark"></span><div><div class="plugin-title">CPA Spark <span class="brand-cn">星火</span></div><p class="plugin-description">轻量预热，按时就绪。</p></div></div>

 </div>
 <div class="plugin-tabbar"><nav class="primary-tabs" role="tablist" aria-label="预热插件功能" id="nav"></nav></div>
</header>
<main class="workspace" id="main" role="tabpanel" aria-labelledby="tab-tasks"></main>
</div>
<dialog id="taskDialog" class="drawer" aria-labelledby="taskHeading"></dialog>
<dialog id="detailDialog" class="drawer" aria-labelledby="detailHeading"></dialog>
<dialog id="groupDialog" class="drawer" aria-labelledby="groupHeading"></dialog>
<dialog id="modalDialog" class="modal" aria-labelledby="modalHeading"></dialog>
<div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>
<script src="./app.js" defer></script>
</body>
</html>
