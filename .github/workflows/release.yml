name: Release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      mode:
        default: draft
        type: string
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.8
        required: true
        type: string
      mode:
        description: Create a draft or publish after all checks pass
        required: true
        default: draft
        type: choice
        options: [draft, publish]
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify tag and source version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/validate_tag.py "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Require bilingual changelog entries
        run: python scripts/release_notes.py --repository "$GITHUB_REPOSITORY" --output .build/notes.md
  build:
    needs: validate
    uses: ./.github/workflows/platform-build.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
  draft:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cpa-spark_${{ needs.validate.outputs.version }}_packages
          path: release/packages
      - name: Generate release notes and store submission draft
        run: |
          python scripts/release_notes.py --repository "$GITHUB_REPOSITORY" --output release/notes.md --store-pr-output release/packages/STORE_PR.md
      - name: Create or resume a draft from validated packages
        run: |
          if release_state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"; then
            if [ "$release_state" != 'true' ]; then
              echo '::error::This Release is already published; create a new version instead.'
              exit 1
            fi
            echo 'Resuming the existing draft without replacing its assets or notes.'
          else
            gh release create "$RELEASE_TAG" release/packages/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --notes-file release/notes.md --title "CPA Spark $RELEASE_TAG"
          fi
      # Draft metadata is only visible to tokens with push access. Reuse the
      # existing Release writer for downloads; verification runners stay read-only.
      - name: Download the actual draft assets for read-only verification
        run: |
          mkdir -p release/downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release/downloaded --pattern '*.zip' --pattern checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpa-spark_${{ needs.validate.outputs.version }}_release_downloads_${{ github.run_attempt }}
          path: release/downloaded/
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: [validate, draft]
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      artifact_name: cpa-spark_${{ needs.validate.outputs.version }}_release_downloads_${{ github.run_attempt }}
  publish:
    if: inputs.mode == 'publish'
    needs: [validate, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Publish the verified draft
        shell: bash
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
  verify_published:
    if: inputs.mode == 'publish'
    needs: [validate, publish]
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
