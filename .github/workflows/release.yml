name: Build release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag, for example v0.1.2
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag and source version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/validate_tag.py "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ./.github/workflows/platform-build.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
  draft:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: store-packages
          path: release/packages
      - name: Generate release notes and store submission draft
        run: |
          python scripts/release_notes.py --repository "$GITHUB_REPOSITORY" --output release/notes.md --store-pr-output release/packages/STORE_PR.md
      - name: Create draft from validated packages
        run: |
          gh release create "$RELEASE_TAG" release/packages/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --notes-file release/notes.md --title "CPA Spark $RELEASE_TAG"
