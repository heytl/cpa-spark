name: Native builds and ABI verification
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve build version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/build_metadata.py --release-tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
  native:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux_amd64, runner: ubuntu-22.04}
          - {target: linux_arm64, runner: ubuntu-22.04-arm}
          - {target: darwin_amd64, runner: macos-15-intel}
          - {target: darwin_arm64, runner: macos-15}
          - {target: windows_amd64, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CPA_RELEASE_TAG: ${{ inputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-2022 includes MinGW-w64; keep the runner's installation intact.
          $compilerBin = 'C:\mingw64\bin'
          $compiler = Join-Path $compilerBin 'gcc.exe'
          if (!(Test-Path $compiler)) { throw "Runner MinGW compiler is missing: $compiler" }
          $target = & $compiler -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target.Trim() -ne 'x86_64-w64-mingw32') {
            throw "Expected an x86_64 MinGW compiler, got: $target"
          }
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'MinGW compiler validation failed' }
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$compilerBin\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci --ignore-scripts
      - name: Check generated frontend and run tests
        run: python scripts/ci.py
      - name: Build on matching architecture and load C ABI
        run: python scripts/build_native.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpa-spark_${{ needs.metadata.outputs.artifact_version }}_native_${{ matrix.target }}
          path: dist/native/
          if-no-files-found: error
          retention-days: 14
  package:
    needs: [metadata, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cpa-spark_${{ needs.metadata.outputs.artifact_version }}_native_*
          path: dist/native
          merge-multiple: true
      - name: Verify ABI receipts and package all platforms
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_VERSION: ${{ needs.metadata.outputs.artifact_version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release_artifacts.py --output release/packages --version "${RELEASE_TAG#v}"
            python scripts/store_registry.py --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --author "$GITHUB_REPOSITORY_OWNER" > release/packages/registry.json
          else
            python scripts/release_artifacts.py --output release/packages --artifact-version "$ARTIFACT_VERSION" --allow-prerelease
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpa-spark_${{ needs.metadata.outputs.artifact_version }}_packages
          path: release/packages/
          if-no-files-found: error
          retention-days: 14
