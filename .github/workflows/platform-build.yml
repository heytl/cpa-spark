name: Native builds and ABI verification
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux_amd64, runner: ubuntu-22.04}
          - {target: linux_arm64, runner: ubuntu-22.04-arm}
          - {target: darwin_amd64, runner: macos-15-intel}
          - {target: darwin_arm64, runner: macos-15}
          - {target: windows_amd64, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CPA_RELEASE_TAG: ${{ inputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Windows C compiler
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@d54f5ef0ce585bd3fbb1f8a71b5b254f59dbf931 # v3.0.4
        with:
          platform: x64
      - run: npm ci --ignore-scripts
      - name: Check generated frontend and run tests
        run: python scripts/ci.py
      - name: Build on matching architecture and load C ABI
        run: python scripts/build_native.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/native/
          if-no-files-found: error
          retention-days: 14
  package:
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - name: Verify ABI receipts and package all platforms
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release_artifacts.py --output release/packages --version "${RELEASE_TAG#v}"
          else
            python scripts/release_artifacts.py --output release/packages --allow-prerelease
          fi
          python scripts/store_registry.py --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --author "$GITHUB_REPOSITORY_OWNER" > release/packages/registry.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-packages
          path: release/packages/
          if-no-files-found: error
          retention-days: 14
