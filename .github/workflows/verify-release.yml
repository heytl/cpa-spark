name: Verify published store packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag, for example v0.1.2
        required: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux_amd64, extension: so, runner: ubuntu-22.04}
          - {target: linux_arm64, extension: so, runner: ubuntu-22.04-arm}
          - {target: darwin_amd64, extension: dylib, runner: macos-15-intel}
          - {target: darwin_arm64, extension: dylib, runner: macos-15}
          - {target: windows_amd64, extension: dll, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download exact published platform archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p .build/download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .build/download --pattern "cpa-spark_${RELEASE_TAG#v}_${TARGET}.zip" --pattern checksums.txt
      - name: Validate and load actual published bytes
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          python scripts/verify_store_package.py --directory .build/download --tag "$RELEASE_TAG" --target "$TARGET" --extract-to .build/library
          python tests/native_smoke.py ".build/library/cpa-spark.$EXTENSION" --expected-version "${RELEASE_TAG#v}"
