name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/platform-build.yml
  prepare_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      resume: ${{ steps.release.outputs.resume }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Tag a new version after all platform checks pass
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_release.py
  release_draft:
    if: needs.prepare_release.outputs.created == 'true' || needs.prepare_release.outputs.resume == 'true'
    needs: prepare_release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare_release.outputs.tag }}
      # Publishing requires an explicit, version-specific maintainer commit.
      mode: ${{ startsWith(github.event.head_commit.message, format('[release:publish {0}]', needs.prepare_release.outputs.tag)) && 'publish' || 'draft' }}
