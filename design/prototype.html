function duplicateInfo(t){const slots=new Set(occurrences(t,5)),hits=[];for(const other of enabledTasks()){if(other.id===t.id||profile(other)!==profile(t))continue;const ordered=[...slots];const overlapping=ordered.length?timelineRangeOccurrences(other,Math.min(...ordered),Math.max(...ordered)+1).filter(at=>slots.has(at)):[];if(!overlapping.length)continue;const ids=new Set(targets(other).filter(a=>!a.reason).map(a=>a.id)),count=targets(t).filter(a=>!a.reason&&ids.has(a.id)).length;if(count)hits.push({task:other,count,at:overlapping[0]})}return hits}

function startRun(t){if(state.settings.paused)return toast('请先恢复全局计划','alert');if(activeRuns.has(t.id))return toast('此任务已有模拟执行正在进行','info');const snapshot=clone(t),ts=targets(snapshot);const r={id:'SIM-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5),taskId:t.id,name:t.name,provider:t.provider,model:t.model,revision:t.revision,started:Date.now(),mode:'manual',finished:false,items:ts.map(v=>({authId:v.id,status:v.reason?'skipped':'queued',message:v.reason||'等待并发名额 / 账号锁',latency:0,tokens:0,sources:[snapshot.name],sourceTaskIds:[snapshot.id]}))};state.runs.unshift(r);let completed=0;state.runs=state.runs.filter(r=>!r.finished||completed++<150);activeRuns.set(t.id,r.id);persist();render();showRun(r.id);toast('模拟批次已创建');pumpSimulations()}

function pumpSimulations(){let changed=false;for(const r of state.runs.filter(r=>!r.finished).sort((a,b)=>a.started-b.started)){for(const i of r.items.filter(i=>i.status==='queued')){const reason=state.settings.paused?'全局计划已暂停':!task(r.taskId)?'任务已删除':skipReason(account(i.authId))||(account(i.authId)?.provider!==r.provider?'提供商不匹配':'');if(reason){i.status='skipped';i.message=reason;changed=true;continue}if(simulationSlots.size>=state.settings.concurrency||simulationSlots.has(i.authId)||[...simulationSlots.values()].filter(s=>s.provider===r.provider).length>=2)continue;i.status='running';i.message='正在模拟请求…';simulationSlots.set(i.authId,{provider:r.provider,runId:r.id});changed=true;setTimeout(()=>{const fail=i.authId==='a3';i.status=fail?'failed':'success';i.message=fail?'429 · 账号额度不足或上游限流，未自动重试':'模型已返回有效回复';i.latency=fail?1180:650+Number(i.authId.replace(/\D/g,''))*73;i.tokens=fail?0:8;simulationSlots.delete(i.authId);pumpSimulations();refreshSimulations()},900)}if(!r.items.some(i=>['queued','running'].includes(i.status))){r.finished=true;activeRuns.delete(r.taskId);changed=true}}if(changed)refreshSimulations()}
function recoverSimulatedRuns(){for(const r of state.runs){if(r.finished)continue;for(const i of r.items){if(i.status==='running'){i.status='unknown';i.message='页面在模拟请求期间重载，结果未确认；不自动重放'}else if(i.status==='queued'){i.status='skipped';i.message='原型重载后不恢复模拟队列，此项未发送'}}r.finished=true}}
function showRun(id){const r=state.runs.find(r=>r.id===id);if(!r)return;detailType='run';detailId=id;renderRunDetail(r);showDialog('detailDialog')}
function renderRunDetail(r){const complete=r.items.filter(i=>!['queued','running'].includes(i.status)).length,ok=r.items.filter(i=>i.status==='success').length,fail=r.items.filter(i=>i.status==='failed').length,skipped=r.items.filter(i=>i.status==='skipped').length;$('#detailDialog').innerHTML=`<div class="drawer-shell"><header class="drawer-header"><div><h2 id="detailHeading">执行详情</h2><p>${esc(r.name)} · ${r.mode==='manual'?'手动模拟':'定时演示'}</p></div><button class="iconbtn" data-action="close" data-id="detailDialog" aria-label="关闭执行详情">${icon('x')}</button></header><div class="drawer-content"><div class="flex between"><span class="status-title">${r.finished?'本批次已结束':'正在逐账号模拟执行'}</span>${statusBadge(runStatus(r))}</div><div class="progressbar"><span style="width:${r.items.length?complete/r.items.length*100:100}%"></span></div><div class="review-stats"><div class="review-stat"><strong style="color:var(--green)">${ok}</strong><span>请求成功</span></div><div class="review-stat"><strong style="color:var(--red)">${fail}</strong><span>请求失败</span></div><div class="review-stat"><strong>${skipped}</strong><span>未发送</span></div></div>${r.items.some(i=>i.status==='unknown')?`<div class="notice" style="margin-bottom:16px">${icon('info')}${r.items.filter(i=>i.status==='unknown').length} 项结果未确认；不计入成功或未发送，也不自动重放。</div>`:''}<div class="detail-row"><span>批次编号</span><span class="mono tiny">${esc(r.id)}</span></div><div class="detail-row"><span>开始时间</span><span>${date(r.started)} ${time(r.started)} · ${esc(state.settings.timezone)}</span></div><div class="detail-row"><span>请求模型</span><span class="mono">${esc(r.model)}</span></div><div class="detail-row"><span>上游窗口重置</span><span class="muted">未知 · 无上游依据</span></div><section class="detail-section"><h3>逐账号结果 <span class="muted">${r.items.length}</span></h3>${r.items.map(i=>{const a=account(i.authId),ic=i.status==='success'?'check':i.status==='failed'?'x':i.status==='running'?'loader':i.status==='queued'?'clock':'info';return `<div class="run-item"><span class="result-icon ${i.status} ${i.status==='running'?'spin':''}">${icon(ic)}</span><div class="grow"><div class="flex between"><span class="small" style="font-weight:550">${esc(a?.name||i.authId)}</span><span class="tiny ${i.status==='failed'?'':'muted'}" style="${i.status==='failed'?'color:var(--red)':''}">${i.status==='success'?'成功':i.status==='failed'?'失败':i.status==='skipped'?'跳过':i.status==='running'?'执行中':i.status==='unknown'?'结果未确认':'待执行'}</span></div><p class="subline" style="line-height:1.8">${esc(i.message)}</p>${i.status==='success'?`<div class="mini-stat mono" style="margin-top:6px">${(i.latency/1000).toFixed(2)}s · ${i.tokens} tokens · 模拟值</div>`:''}${i.sources?.length>1?`<span class="badge orange" style="white-space:normal;margin-top:7px">${icon('merge')}合并来源：${i.sources.map(esc).join('、')}</span>`:''}</div></div>`}).join('')}</section><div class="notice neutral" style="margin-top:20px">${icon('shield')}本批次使用虚构数据。成功仅代表模拟请求成功，不代表真实额度或窗口变化。</div></div><footer class="drawer-footer"><span class="tiny muted">${complete} / ${r.items.length} 个账号已处理</span><div class="flex">${!r.finished?`<button class="btn danger" data-action="cancel-run" data-id="${r.id}">取消待执行项</button>`:''}<button class="btn" data-action="close" data-id="detailDialog">关闭</button></div></footer></div>`}
function showAccount(id){detailType='account';detailId=id;accountDetailId=id;renderAccountDetail();showDialog('accountDialog')}
function renderAccountDetail(){const a=account(accountDetailId);if(!a)return;const {tasks:ts,upcoming:events,past}=accountTimelineData(a.id);const paused=!!state.overrides[a.id],gs=state.groups.filter(g=>g.members.includes(a.id));$('#accountDialog').innerHTML=`<div class="drawer-shell"><header class="drawer-header"><div><h2 id="accountHeading">账号时间线</h2><p>汇总这个账号来自所有任务的运行安排。</p></div><button class="iconbtn" data-action="close" data-id="accountDialog" aria-label="关闭账号详情">${icon('x')}</button></header><div class="drawer-content"><div class="account-hero">${avatar(a)}<div><h2>${esc(a.name)}</h2><p class="subline">${esc(a.email)}</p></div></div><div class="flex" style="flex-wrap:wrap;margin-bottom:16px"><span class="badge">${esc(PROVIDERS[a.provider])}</span><span class="badge blue">${esc(a.plan)}</span>${a.status==='active'?statusBadge('success','账号可用'):statusBadge('skipped',a.status==='disabled'?'CPA 已禁用':'需重新登录')}</div><div class="detail-row"><span>预热状态</span><div class="flex"><span class="small ${paused?'muted':''}">${paused?'全部预热已暂停':'允许预热'}</span><button class="switch ${paused?'':'on'}" role="switch" aria-checked="${!paused}" aria-label="账号详情预热开关" data-action="pause-account" data-id="${a.id}"></button></div></div><div class="detail-row"><span>所在分组</span><span>${gs.map(g=>`<span class="badge ${g.color}">${esc(g.name)}</span>`).join(' ')||'未分组'}</span></div><div class="detail-row"><span>关联任务</span><span>${ts.length} 条 · ${ts.filter(t=>t.enabled).length} 条已启用</span></div>${paused||state.settings.paused||a.status!=='active'?`<div class="notice neutral" style="margin-top:18px">${icon('pause')}${paused?'此账号已暂停预热。下方保留计划展示，暂停期间不发送。':state.settings.paused?'全局调度已暂停，下方为保存的计划。':esc(skipReason(a))+'，将跳过这些计划。'}</div>`:''}<section class="detail-section"><h3>过去 24 小时执行记录</h3><div class="account-timeline">${past.length?past.map(e=>`<div class="account-event"><div class="flex between"><span class="mono small">${previewTimestamp(e.at)}</span>${statusBadge(e.status)}</div><p><button class="name-link" translate="no" data-action="run-detail" data-id="${esc(e.runId)}">${esc(e.name)}</button></p><p class="mono" translate="no">${esc(e.model)}</p></div>`).join(''):'<div class="small muted">过去 24 小时暂无执行记录</div>'}</div></section><section class="detail-section"><h3>未来 24 小时计划</h3><div class="account-timeline">${events.length?events.map(e=>`<div class="account-event"><h3><span class="mono">${time(e.at)}</span> <span class="tiny muted" style="font-weight:400;margin-left:6px">${dayLabel(e.at)} · ${date(e.at)}</span></h3><p>${e.tasks.map(t=>esc(t.name)).join(' + ')}</p><p class="mono">${esc(e.model)}</p>${e.tasks.length>1?`<span class="badge orange">${icon('merge')}${e.tasks.length} 条任务合并为 1 次请求</span>`:''}</div>`).join(''):'<div class="small muted">未来 24 小时暂无计划</div>'}</div></section><section class="detail-section"><h3>关联任务</h3>${ts.map(t=>`<div class="detail-row"><button class="name-link" data-action="account-edit-task" data-id="${t.id}">${esc(t.name)}</button><span class="tiny muted">${t.enabled?'已启用':'已暂停'} ${icon('chevron')}</span></div>`).join('')}</section></div><footer class="drawer-footer"><span class="tiny muted">按账号与请求配置合并重复命中</span><button class="btn" data-action="close" data-id="accountDialog">关闭</button></footer></div>`}
function download(name,data){const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('导出文件已准备好')}
function navigate(id){view=id;location.hash=id;selected.clear();openMenu=null;render()}
document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
 if(action!=='menu')openMenu=null;
 switch(action){
  case 'nav':navigate(id);break;
  case 'timeline-day':windowTimelineState.dayOffset=id==='today'?0:windowTimelineState.dayOffset+Number(id);render();break;
  case 'timeline-hours':windowTimelineState.hours=Number(id);render();break;
  case 'timeline-paused':windowTimelineState.showPaused=el.checked;render();break;
  case 'timeline-detail':showTimelineDetail(id);break;
  case 'new-task':openTask();break;
  case 'edit-task':openTask(id);break;
  case 'group-task':openTask(null,id);break;
  case 'account-edit-task':closeDialog('accountDialog');openTask(id);break;
  case 'close':closeDialog(id);break;
  case 'global-pause':state.settings.paused=!state.settings.paused;pumpSimulations();persist();render();toast(state.settings.paused?'已暂停全部新请求，任务配置已保留':'调度已恢复，从下一个时间点继续');break;
  case 'toggle-task':{const t=task(id);t.enabled=!t.enabled;persist();render();toast(`${t.name}定时计划已${t.enabled?'启用':'暂停'}${activeRuns.has(t.id)?'；手动批次请单独取消':''}`);break}

  case 'task-tab':filters.tab=id;selected.clear();render();break;
  case 'account-tab':filters.accountTab=id;filters.accountQuery='';render();break;
  case 'clear-filters':filters.query='';filters.provider='all';filters.tab='all';render();break;
  case 'select-task':selected.has(id)?selected.delete(id):selected.add(id);render();break;
  case 'select-all':{const ids=state.tasks.filter(taskMatches).map(t=>t.id),all=ids.every(id=>selected.has(id));ids.forEach(id=>all?selected.delete(id):selected.add(id));render();break}
  case 'clear-selected':selected.clear();render();break;
  case 'bulk':state.tasks.forEach(t=>{if(selected.has(t.id))t.enabled=id==='enable'});toast(`已${id==='enable'?'启用':'暂停'} ${selected.size} 个任务`);selected.clear();persist();render();break;
  case 'menu':openMenu=openMenu===id?null:id;render();break;
  case 'duplicate-task':{const src=task(id),t=clone(src);t.id='t'+Date.now().toString(36);t.name=src.name+' · 副本';t.enabled=false;t.revision=1;state.tasks.unshift(t);persist();render();toast('已复制任务，新任务默认暂停');break}
  case 'delete-task':{const t=task(id);modal('删除这条任务？',`<p class="small muted" style="line-height:1.9">将删除「${esc(t.name)}」并停止其未来计划。已有执行记录保留，已发出的请求不会被终止。</p>`,'删除任务',()=>{state.tasks=state.tasks.filter(t=>t.id!==id);selected.delete(id);pumpSimulations();persist();render();toast('任务已删除')},true);break}
  case 'task-next':{const err=validateDraft(taskStep);if(err){taskError(err);break}taskStep=Math.min(2,taskStep+1);renderTaskDialog();break}
  case 'task-prev':readTaskForm();taskStep=Math.max(0,taskStep-1);renderTaskDialog();break;
  case 'target-mode':readTaskForm();taskTargetMode=id;if(id==='groups')draft.accountIds=[];if(id==='accounts')draft.groupIds=[];renderTaskDialog();break;
  case 'draft-select-all':{readTaskForm();if(id==='groups')draft.groupIds=state.groups.filter(g=>g.provider===draft.provider).map(g=>g.id);else draft.accountIds=state.accounts.filter(a=>a.provider===draft.provider&&!skipReason(a)).map(a=>a.id);renderTaskDialog();break}
  case 'days-preset':readTaskForm();draft.days=id==='daily'?[0,1,2,3,4,5,6]:id==='work'?[1,2,3,4,5]:[0,6];renderTaskDialog();break;
  case 'day-toggle':readTaskForm();draft.days.includes(Number(id))?draft.days=draft.days.filter(v=>v!==Number(id)):draft.days.push(Number(id));renderTaskDialog();break;
  case 'add-time':readTaskForm();if(draft.times.length>=24){toast('每天最多设置 24 个时间点','info');break}draft.times.push('12:00');renderTaskDialog();break;
  case 'remove-time':readTaskForm();draft.times.splice(Number(id),1);renderTaskDialog();break;
  case 'draft-enabled':readTaskForm();draft.enabled=!draft.enabled;renderTaskDialog();break;
  case 'save-task':saveTask();break;
  case 'new-group':openGroup();break;
  case 'edit-group':openGroup(id);break;
  case 'group-color':readGroupForm();groupDraft.color=id;renderGroupDialog();break;
  case 'group-select-all':{readGroupForm();const ids=state.accounts.filter(a=>a.provider===groupDraft.provider).map(a=>a.id);groupDraft.members=ids.every(id=>groupDraft.members.includes(id))?[]:ids;renderGroupDialog();break}
  case 'save-group':saveGroup();break;
  case 'delete-group':{const g=group(id),refs=state.tasks.filter(t=>t.groupIds.includes(id));modal('删除这个分组？',`<p class="small muted" style="line-height:1.9">将删除「${esc(g.name)}」，账号本身保留。${refs.length?`以下 ${refs.length} 条任务会移除此组引用；失去全部目标的任务会自动暂停。`:'当前没有任务引用这个分组。'}</p>${refs.map(t=>`<div class="detail-row">${esc(t.name)}</div>`).join('')}`,'删除并处理引用',()=>{state.groups=state.groups.filter(g=>g.id!==id);state.tasks.forEach(t=>{t.groupIds=t.groupIds.filter(v=>v!==id);if(!targetIDs(t).length)t.enabled=false});persist();closeDialog('groupDialog');render();toast('分组已删除，任务引用已处理')},true);break}
  case 'run-task':openRunPreview(id);break;
  case 'run-detail':showRun(id);break;
  case 'account-detail':showAccount(id);break;
  case 'pause-account':state.overrides[id]=!state.overrides[id];pumpSimulations();persist();render();if(accountDetailId===id&&$('#accountDialog').open)renderAccountDetail();toast(state.overrides[id]?'已暂停此账号的所有预热':'已恢复此账号的预热');break;
  case 'cancel-run':{const r=state.runs.find(r=>r.id===id);r.items.forEach(i=>{if(i.status==='queued'){i.status='skipped';i.message='用户取消，尚未发送'}});pumpSimulations();persist();renderRunDetail(r);render();toast('待执行项已取消，在途模拟请求继续完成');break}
  case 'modal-confirm':{const fn=modalAction;modalAction=null;closeDialog('modalDialog');fn?.();break}
  case 'save-settings':state.settings.timezone=$('#settingZone').value;state.settings.concurrency=Number($('#settingConcurrency').value);state.settings.late=Number($('#settingLate').value);state.settings.retention=Number($('#settingRetention').value);pumpSimulations();settingsDraft=null;persist();render(false);toast('调度偏好已保存');break;
  case 'export-config':download('cpa-spark-demo-config.json',{schema:1,groups:state.groups,tasks:state.tasks,settings:state.settings,notice:'Prototype configuration; account identifiers are fictional.'});break;
  case 'export-history':download('cpa-spark-demo-history.json',{notice:'All results are simulated.',runs:state.runs});break;
  case 'reset-demo':modal('恢复初始演示数据？','<p class="small muted" style="line-height:1.9">当前原型中新增的任务、分组和模拟记录将被替换为初始示例。此操作仅影响当前浏览器里的原型数据。</p>','恢复初始数据',()=>{if(activeRuns.size){toast('请等待模拟批次结束后再恢复','info');return}state=seed();settingsDraft=null;filters.query='';filters.accountQuery='';selected.clear();persist();render(false);toast('已恢复初始演示数据')},true);break;
  case 'about':modal('关于这个原型','<div class="notice info">'+icon('info')+'这是 CPA Spark 的交互设计原型，用于体验单账号与分组独立调度。</div><div class="divider"></div><p class="small muted" style="line-height:2">可以新建和编辑任务、创建分组、查看账号时间线、模拟执行并检查逐账号结果。<br><br>账号、模型和结果均为演示数据。修改保存在当前浏览器，刷新后保留；没有接入真实 CPA，不会定时或主动调用任何真实账号。<br><br>正式插件将由 CPA 服务端完成定时调度。</p>');break;
 }
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.filter!==undefined){filters[el.dataset.filter]=el.value;selected.clear();render()}if(el.id==='settingConcurrency')$('#concurrencyValue').textContent=el.value;});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter!==undefined){filters[el.dataset.filter]=el.value;selected.clear();render()}
 if(el.dataset.draftSelect){const key=el.dataset.draftSelect;if(el.checked&&!draft[key].includes(el.value))draft[key].push(el.value);else if(!el.checked)draft[key]=draft[key].filter(v=>v!==el.value);if(taskStep===2){readTaskForm();renderTaskDialog()}else if($('#draftTargetCount'))$('#draftTargetCount').textContent=`已覆盖 ${targets(draft).length} 个账号`}
 if(el.id==='taskProvider'){readTaskForm();draft.groupIds=[];draft.accountIds=[];draft.excludes=[];draft.model=MODELS[el.value][0];renderTaskDialog()}
 if(el.id==='taskZone'||el.dataset.timeIndex!==undefined||el.id==='taskModel'||el.id==='taskEffort'){readTaskForm();renderTaskDialog()}
 if(el.hasAttribute('data-group-member')){if(el.checked&&!groupDraft.members.includes(el.value))groupDraft.members.push(el.value);else if(!el.checked)groupDraft.members=groupDraft.members.filter(id=>id!==el.value);if($('#groupMemberCount'))$('#groupMemberCount').textContent=`已选择 ${groupDraft.members.length} 个账号`}
 if(el.id==='groupProvider'){readGroupForm();groupDraft.provider=el.value;groupDraft.members=[];renderGroupDialog()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openMenu){openMenu=null;render()}});
for(const d of $$('dialog')){d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}});d.addEventListener('close',()=>{if(d.id==='detailDialog'){detailType=$('#accountDialog').open?'account':'';detailId=$('#accountDialog').open?accountDetailId:''}if(d.id==='accountDialog'){accountDetailId='';if(detailType==='account'){detailType='';detailId=''}}})}
document.addEventListener('keydown',e=>{const el=e.target.closest('#nav [role="tab"]');if(!el)return;const ids=['tasks','accounts','history','settings'],at=ids.indexOf(el.dataset.id);let next;if(e.key==='ArrowRight')next=(at+1)%ids.length;else if(e.key==='ArrowLeft')next=(at+ids.length-1)%ids.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=ids.length-1;else return;e.preventDefault();navigate(ids[next]);document.getElementById('tab-'+ids[next]).focus()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['tasks','accounts','history','settings'].includes(h)&&h!==view){view=h;render()}});
$('#brandMark').innerHTML='<img class="spark-logo" src="../logo.svg" width="33" height="33" alt="" aria-hidden="true">';$('#helpIcon').innerHTML=icon('help');
recoverSimulatedRuns();
initializeHostPreferences();persist();render();localizeUI(document.body);
setInterval(()=>{if(view!=='tasks'||document.querySelector('dialog[open]')||$('#main').contains(document.activeElement))return;const left=$('.wt-scroll')?.scrollLeft||0;render();if($('.wt-scroll'))$('.wt-scroll').scrollLeft=left},60000);
</script>
</body>
</html>
